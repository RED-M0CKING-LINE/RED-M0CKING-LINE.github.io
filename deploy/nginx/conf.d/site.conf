# https://nginx.org/en/docs/
# https://configurator.tlsref.org/

# Block bad bots only from public IPs
map "$is_private:$bad_bot" $block_request {
    "0:1"   1;  # Public IP, Bad Bot, Block
    "1:1"   0;  # Private IP, Bad Bot, Allow
    default 0;  # Allow
}

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=health_limit:5m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_log_level warn;

# Upstream
upstream app_backend {
    server website-app:8080;
    keepalive 32;
}

# Dummy Server https://calvin.my/posts/adding-a-catch-all-black-hole-blocks-in-nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # listen 443 quic reuseport default_server;  # Apprently nginx doesnt like this
    # listen [::]:443 quic reuseport default_server;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/keys/dummy.crt;
    ssl_certificate_key /etc/nginx/keys/dummy.key;
    return 444;
    # location / {
        # return 200 "TESTING!! HTTP only request!";
    # }
}

# Redirection server for correct hostnames
server {
    listen 80;
    listen [::]:80;
    server_name www.ethanashley.net ethanashley.net dev.www.ethanashley.net localhost 127.0.0.1 [::1] nginx 192.168.1.175;
    limit_req zone=global_limit nodelay;
    # Health endpoints (private only)
    location = /healthz {
        limit_req zone=health_limit;
        if ($is_private = 0) { return 403; }
        access_log off;
        error_log /var/log/nginx/error.log warn;
        proxy_pass http://app_backend;
    }
    location = /readyz {
        limit_req zone=health_limit;
        if ($is_private = 0) { return 403; }
        access_log off;
        error_log /var/log/nginx/error.log warn;
        proxy_pass http://app_backend;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

# Main server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport bind;
    listen [::]:443 quic reuseport bind;
    server_name www.ethanashley.net ethanashley.net dev.www.ethanashley.net localhost 127.0.0.1 [::1] nginx 192.168.1.175;
    ssl_certificate     /etc/nginx/keys/www.ethanashley.net.crt;
    ssl_certificate_key /etc/nginx/keys/www.ethanashley.net.key;

    # OCSP stapling
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /path/to/root_CA_cert_plus_intermediates;
    # resolver 127.0.0.1;

    http2 on;
    http3 on;
    quic_retry on;
    quic_gso on;

    limit_req zone=global_limit burst=120 nodelay;

    # Blackhole suspect bots and scanning traffic
    include /etc/nginx/conf.d/blackhole.include;


    # Security headers (the app sets these too)
    # HSTS  TEST ME
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(),microphone=(),geolocation=(),payment=(),usb=()" always;
    # add_header Permissions-Policy "accelerometer=(),ambient-light-sensor=(),autoplay=(),battery=(),camera=(),display-capture=(),document-domain=(),encrypted-media=(),execution-while-not-rendered=(),execution-while-out-of-viewport=(),fullscreen=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),navigation-override=(),payment=(),picture-in-picture=(),publickey-credentials-get=(),speaker-selection=(),sync-xhr=(),usb=(),vr=(),xr-spatial-tracking=()" always;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;


    etag on; # Im not currently using etags in the app but i probably could

    # Disable directory listing
    autoindex off;

    # Protected paths: never index or cache
    location ^~ /protected {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://app_backend;
    }
    location ^~ /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://app_backend;
    }

    # Blog traffic
    location ^~ /blog {
        proxy_pass http://app_backend;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }


    # Static assets: cache aggressively with cache busting at in the application
    location /static/ {
        proxy_pass http://app_backend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # access_log off;
    }

    # Set the right MIME type for WASM
    location ~* \.wasm$ {
        proxy_pass http://app_backend;
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
    }

    # specific files
    location = /robots.txt { 
        proxy_pass http://app_backend;
        expires 12h; 
        add_header Cache-Control "public, max-age=3600, immutable";
    }
    location = /security.txt { 
        proxy_pass http://app_backend;
        expires 12h; 
        add_header Cache-Control "public, max-age=3600, immutable";
    }
    location = /sitemap.xml { 
        proxy_pass http://app_backend;
        expires 1h; 
        add_header Cache-Control "public, max-age=3600";
    }
    location = /feed.xml { 
        proxy_pass http://app_backend;
        expires 15m; 
        add_header Cache-Control "public, max-age=900"; 
    }
    location = /atom.xml { 
        proxy_pass http://app_backend;
        expires 15m; 
        add_header Cache-Control "public, max-age=900"; 
    }
    # Health endpoints
    location = /healthz {
        limit_req zone=health_limit;
        # if ($is_private = 0) { return 403; }
        access_log off;
        proxy_pass http://app_backend;
    }
    location = /readyz {
        limit_req zone=health_limit;
        if ($is_private = 0) { return 403; }
        access_log off;
        proxy_pass http://app_backend;
    }

    # Default app traffic
    location / {
        proxy_pass http://app_backend;
    }
}
