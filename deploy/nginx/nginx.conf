user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

# error_log  /var/log/nginx/error.log warn;
# error_log  /var/log/nginx/error.log notice;
error_log  /var/log/nginx/error.log debug;

# Includes files with directives to load dynamic modules.
include /etc/nginx/modules/*.conf;

load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    more_clear_headers Server;
    more_set_headers "X-Powered-By: ";
    server_tokens off;
    server_name_in_redirect off;
    proxy_hide_header on;
    disable_symlinks on;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main buffer=16k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;


    # Common proxy_pass headers
    # Real client IPs come through X-Forwarded-For
    proxy_http_version 1.1;
    proxy_set_header Connection           "";
    proxy_set_header Host                 $host;
    proxy_set_header X-Real-IP            $remote_addr;
    proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto    $scheme;
    proxy_set_header X-Forwarded-Host     $host;
    proxy_set_header X-Request-ID         $request_id;
    
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    
    # Avoid buffering large/streamed responses by disabling it for those paths
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 4k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 0;

    # Hard limits
    client_max_body_size 10m;
    client_body_buffer_size 32k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    limit_conn conn_per_ip 500;

    keepalive_timeout 15;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 30;

    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve secp384r1:prime256v1:X25519;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_early_data on;

    # gzip
    gzip on;
    gzip_comp_level 3;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Brotli (better compression)
    brotli on;
    brotli_comp_level 4;
    brotli_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/conf.d/*.conf;
}
